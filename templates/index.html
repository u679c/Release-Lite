<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Release Lite</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/static/vendor/xterm/xterm.css?v=5.3.0" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a
          class="brand"
          href="#"
          onclick="
            showPage('overview');
            return false;
          "
          ><span class="brand-mark">R</span><span>Release <b>Lite</b><small>发布管理台</small></span></a
        >
        <nav class="nav flex-column" aria-label="主导航">
          <button class="nav-link active" data-page="overview" onclick="showPage('overview')">
            <span><i class="bi bi-speedometer2"></i></span> 首页
          </button>
          <button class="nav-link" data-page="projects" onclick="showPage('projects')">
            <span><i class="bi bi-box-seam"></i></span> 项目管理
          </button>
          
          <button class="nav-link more-menu-toggle" type="button" onclick="toggleMoreMenu()"><span><i class="bi bi-three-dots"></i></span> 更多 <i class="bi bi-chevron-down more-menu-arrow"></i></button>
          <div id="moreMenu" class="sidebar-submenu" hidden>
            <button class="nav-link" data-page="tmux" onclick="showPage('tmux')"><span><i class="bi bi-terminal"></i></span> Tmux 管理</button>
            <button class="nav-link" data-page="storage" onclick="showPage('storage')"><span><i class="bi bi-device-hdd"></i></span> 日志 管理</button>
            <button class="nav-link" data-page="operations" onclick="showPage('operations')">
            <span><i class="bi bi-clock-history"></i></span> 操作记录
          </button>
          </div>
        </nav>
        <div class="sidebar-footer"><span class="online-dot"></span> 面板服务运行中</div>
      </aside>
      <div class="main-area">
        <main class="content-area">
          <span id="pageEyebrow" hidden></span><span id="pageTitle" hidden></span><span id="host" hidden></span>
          <section class="page-view active" id="overview-page">
            <section class="metrics row g-3" id="metrics"></section>
            <section class="content-card system-card">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">SERVER</p>
                  <h2>设备信息</h2>
                </div>
                <span class="muted">每 10 秒更新</span>
              </div>
              <div class="system-grid" id="systemInfo"></div>
            </section>
            <section class="content-card">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">PROJECTS</p>
                  <h2>项目运行概况</h2>
                </div>
                <button class="btn btn-outline-primary btn-sm" onclick="showPage('projects')">查看全部</button>
              </div>
              <div id="projectSummary" class="summary-list"></div>
            </section>
          </section>
          <section class="page-view" id="projects-page">
            <div class="section-heading page-heading project-page-heading"><div class="project-filters" role="search"><input id="projectNameFilter" class="form-control" type="search" placeholder="搜索项目名称" aria-label="搜索项目名称" oninput="filterProjects()"><select id="projectRuntimeFilter" class="form-select" aria-label="按项目类型筛选" onchange="filterProjects()"><option value="">全部类型</option><option value="python">Python</option><option value="node">Node.js</option><option value="generic">通用</option></select></div><button class="btn btn-primary" onclick="openEditor()">+ 新建项目</button></div>
            <section class="content-card project-table-card">
              <div class="table-responsive">
                <table class="table align-middle project-table mb-0">
                  <thead>
                    <tr>
                      <th>项目</th>
                      <th>分支</th>
                      <th>状态</th>
                      <th>运行资源</th>
                      <th>端口</th>
                      <th class="text-end">操作</th>
                    </tr>
                  </thead>
                  <tbody id="projects"></tbody>
                </table>
              </div>
            </section>
          </section>
          <section class="page-view" id="operations-page">
            <div class="section-heading page-heading"><button class="btn btn-outline-secondary btn-sm" onclick="refresh()">刷新</button></div>
            <section class="content-card operation-card"><div id="operations"></div></section>
          </section>
          <section class="page-view" id="tmux-page">
            <div class="section-heading page-heading"><div><h2>Tmux 会话</h2><p class="muted mb-0">管理由 Release Lite 创建的项目终端会话。</p></div><button class="btn btn-outline-secondary btn-sm" onclick="loadTmuxSessions()"><i class="bi bi-arrow-clockwise"></i> 刷新</button></div>
            <section class="tmux-grid" id="tmuxSessions"></section>
          </section>
          <section class="page-view" id="storage-page">
            <section class="content-card storage-card"><div class="storage-toolbar"><div class="storage-filters"><label>项目：<select id="storageProjectFilter" class="form-select" aria-label="按项目筛选日志" onchange="resetStorageLogPage()"><option value="">全部项目</option></select></label><label>日志类型：<select id="storageTypeFilter" class="form-select" aria-label="按日志类型筛选" onchange="resetStorageLogPage()"><option value="">全部日志类型</option><option value="runtime">运行日志</option><option value="deploy">代码更新日志</option><option value="dependencies">依赖更新日志</option></select></label></div><div class="storage-actions"><button class="btn btn-outline-secondary btn-sm" onclick="loadStorageLogs()">刷新</button><button id="deleteStorageLogsButton" class="btn btn-outline-danger btn-sm" type="button" onclick="deleteSelectedStorageLogs()" disabled>删除选中</button><button class="btn btn-outline-secondary btn-sm" type="button" onclick="resetStorageFilters()">重置</button></div></div><div class="table-responsive"><table class="table align-middle project-table mb-0"><thead><tr><th><input id="storageSelectAll" type="checkbox" aria-label="全选日志" onchange="toggleAllStorageLogs(this.checked)"></th><th>项目</th><th>日志类型</th><th><button class="storage-sort-button" type="button" onclick="toggleStorageSizeSort()">大小 <span class="storage-sort-icon"><i class="bi bi-chevron-up" data-direction="asc"></i><i class="bi bi-chevron-down" data-direction="desc"></i></span></button></th><th>更新时间</th><th>文件名</th></tr></thead><tbody id="storageLogs"></tbody></table></div><div class="storage-pagination"><span id="storagePaginationInfo"></span><div id="storagePagination"></div></div></section>
          </section>
          <section class="page-view" id="detail-page">
            <section class="content-card detail-page-card"><div id="details"></div></section>
          </section>
      </main>
    </div>
  </div>
  <dialog id="directoryDialog" class="directory-dialog"><section><header><h2>选择服务器目录</h2><button aria-label="关闭" onclick="$('#directoryDialog').close()">×</button></header><div id="directoryPicker"></div></section></dialog>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script src="/static/vendor/socket.io/socket.io.min.js?v=4.7.5"></script>
  <script src="/static/vendor/xterm/xterm.min.js?v=5.3.0"></script>
  <script src="/static/vendor/xterm/xterm-addon-fit.min.js?v=0.8.0"></script>
  <script src="/static/app.js?v=terminal-v3"></script>
  </body>
</html>
