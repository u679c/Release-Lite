<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>通知测试 · Release Lite</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="{{ url_for('issue_management.static', filename='issues.css') }}" />
    <link rel="stylesheet" href="/static/notification-test.css" />
  </head>
  <body class="notification-test-page">
    <main class="notification-test-main">
      <header class="section-heading">
        <h1>通知测试</h1>
        <span id="notificationPermission" class="badge text-bg-secondary" role="status"></span>
      </header>
      <section class="content-card">
        <form id="notificationTestForm" class="notification-test-form">
          <label>标题<input class="form-control" name="title" value="测试通知" maxlength="120" required /></label>
          <label>内容<textarea class="form-control" name="body" rows="3" maxlength="500" required>这是一条测试通知</textarea></label>
          <div class="notification-test-options">
            <label>通知方式<select class="form-select" name="mode">
              <option value="auto">自动选择（前台站内，后台浏览器）</option>
              <option value="in-app">站内通知</option>
              <option value="browser">浏览器通知</option>
            </select></label>
            <label>延迟（秒）<input class="form-control" name="delay" type="number" min="0" max="3600" step="1" value="5" required /></label>
          </div>
          <p class="muted mb-0">0 秒立即发送；延迟发送时请保持页面打开。</p>
          <div class="notification-test-actions">
            <button class="btn btn-primary" type="submit">发送测试</button>
            <button id="authorizeNotifications" class="btn btn-outline-secondary" type="button">授权浏览器通知</button>
          </div>
          <p id="notificationTestStatus" class="notification-test-status mb-0" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="content-card">
        <div class="section-heading">
          <h2>待发送</h2>
          <button id="cancelAllNotifications" class="btn btn-outline-secondary btn-sm" type="button" hidden>取消全部</button>
        </div>
        <p id="notificationTasksEmpty" class="muted mb-0">暂无待发送通知</p>
        <ul id="notificationTasks" class="notification-test-tasks"></ul>
      </section>
    </main>
    <div id="bugNotificationContainer" class="issue-bug-notifications" aria-live="polite"></div>
    <script src="{{ url_for('issue_management.static', filename='bug-notifications.js') }}"></script>
    <script src="/static/notification-test.js"></script>
  </body>
</html>
